[tool.poetry]
name = "toxic-comment-classification"
version = "0.1.0"
description = "Multi-label toxic comment classification (TextCNN) with Lightning + Hydra + DVC + MLflow"
authors = ["George <lavrenvog471@gmail.com>"]
readme = "README.md"
packages = [{ include = "toxic_comment_classification", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
torch = "^2.3.0"
pytorch-lightning = "^2.4.0"
torchmetrics = "^1.4.0"
hydra-core = "^1.3.2"
omegaconf = "^2.3.0"
mlflow = "^2.15.0"
dvc = "^3.50.0"
datasets = "^2.20.0"
scikit-learn = "^1.5.0"
numpy = "^1.26.0"

[tool.poetry.group.dev.dependencies]
pre-commit = "^3.7.1"
ruff = "^0.6.0"
pytest = "^8.3.0"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
